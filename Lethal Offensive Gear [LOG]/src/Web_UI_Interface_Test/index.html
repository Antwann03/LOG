<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Robot Control</title>
    <style>
        html, body
        {
            height:100%;
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;

        }
        body
        {
            background-image:url("9895435.png");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            background-repeat: no-repeat;
            color: black;
            text-align: center;
            margin-top: 100px;
        }
        button 
        {
            width: 120px;
            height: 60px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
        }
        .row
        {
            margin: 15px;
        }
        img
        {
            width: 200px;
            margin-bottom: 20px;
            height:auto;
        }
        button
        {
            width:120px;
            height:60px;
            font-size:20px;
            cursor: pointer;
            margin:10px;
        }
    </style>
</head>
<body>

    <h1>LOG Robot Controller</h1>
    <img src="csun_logo.png">

    <div class="row">
        <button onclick="sendCmd('forward')">Forward</button>
    </div>
    <div class="row">
        <button onclick="sendCmd('left')">Left</button>
        <button onclick="sendCmd('stop')">Stop</button>
        <button onclick="sendCmd('right')">Right</button>
    </div>
    <div class="row">
        <button onclick="sendCmd('back')">Backward</button>
    </div>

    <script>
        function sendCmd(cmd) {
            fetch(`/cmd?move=${cmd}`)
                .catch(err => console.log("Command failed", err));
        }
    </script>

</body>
</html>
